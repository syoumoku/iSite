        proxy_model: [场景类型, 主要高价值证明指标, 面积/尺度字段, 年访问量Proxy, attach_rate, indoor_capture, busy_hour_factor, GB/user/BH]
        review_queue: [行号, 国家, 城市, 物业名, 复核原因, 下一步动作]
        country_summary: [国家, 候选点数量, 机场, 会展中心, 商场/Mixed-use, 体育场, 酒店/MICE, 办公/政府, 医院, 大学, 交通枢纽, 清真寺]
      method_rows:
        - [本轮任务范围, "{scope_text}"]
        - [主表规则, 主表只保留物业级关键结果；通用公式和定义不逐行重复。]
        - [排序规则, 主表按年访问量估计从高到低排序；场景分表按该场景主指标数值从高到低排序，缺失或非数值排末尾。“主指标量化值”列位于“物业点重要证据”右侧，从当前选中的物业点重要证据中提取纯数字，便于 Excel 一键排序。]
        - [推荐门槛规则, 推荐筛选阶段对所有场景的主指标字段先做规则预识别；启用 GPT 主指标归一时，再由 GPT 将原始字段映射到当前场景允许的 canonical metric key，并经过白名单和置信度校验。推荐门槛仍使用项目级固定 First Class 门槛；未配置固定门槛的场景回退为国家+场景第10名硬主指标。推荐行在主表和各场景分表以浅黄色高亮，“是否被推荐”列填 yes，并汇总到推荐清单页签。]
        - [证据规则, 结论必须回溯到字段级证据、来源、日期、证据等级和交叉校验状态。]
        - [推测规则, 推测只补空字段，必须写入推测留痕，不能覆盖直接证据。]
        - [场景建模规则, 每个场景使用独立主指标、Proxy Basis 和参数区间。]
        - [Proxy 规则, Proxy 模型集中写入 Proxy模型 sheet。]
        - [室分状态字段规则, 现网建设状态独立判断；Unknown 允许，空值不允许。]
        - [输出约束, 主表固定表头；场景分表保留空表头。“主指标量化值”为数值型列，不是格式化文本复制。]
        - [证据状态定义, Verified / Supported / Indicative / Insufficient。]
        - [Google地图链接规则, 主表必须保留 Google地图链接。]
