        mosque: Mosques
      columns:
        main: [Country, City, Property Name, Longitude, Latitude, Scene Type, Core Objective Evidence, Primary Metric Value, Estimated Annual Visits (Proxy), "Busy-hour Traffic (GB/h, Proxy)", Indoor System Presence, RAT (4G/5G), Operator, Indoor System Type, Evidence Batch, Evidence Status, Recommended, Recommendation Reason, Next Verification Action, Google Maps Link]
        recommendation: [Country, City, Property Name, Scene Type, Recommendation Rank, Recommendation Threshold, Threshold Metric, Threshold Metric Value, Core Objective Evidence, Estimated Annual Visits (Proxy), Recommendation Reason, Google Maps Link]
        evidence: [Row, Country, City, Property Name, Scene Type, Field Group, Original Evidence, Evidence Translation, Evidence Type / Proxy Basis, Evidence Tier, Source 1 URL, Source 2 URL, Cross-check Status]
        inference: [Row, Country, Property Name, Inferred Field, Inferred Value, Inference Basis, Inference Chain, Inference Confidence]
        proxy_model: [Scene Type, Primary Value Indicators, Area / Scale Field, Annual Visit Proxy, attach_rate, indoor_capture, busy_hour_factor, GB/user/BH]
        review_queue: [Row, Country, City, Property Name, Review Reason, Next Action]
        country_summary: [Country, Candidate Count, Airport, Convention Center, Mall / Mixed-use, Stadium, Hotel / MICE, Office / Government, Hospital, University, Transport Hub, Mosque]
      method_rows:
        - [Scope, "{scope_text}"]
        - [Main Table Rule, Main table keeps property-level key results only; shared formulas and definitions are not repeated row by row.]
        - [Sorting Rule, Main table sorts by estimated annual visits descending; scene sheets sort by scene primary metric value descending, with missing or non-numeric metrics at the end. The Primary Metric Value column sits immediately to the right of Core Objective Evidence and extracts the selected evidence numeric value for one-click Excel sorting.]
        - [Recommendation Threshold Rule, Recommendations use project-level fixed First Class thresholds first. Configured scenes use their hard primary metric threshold; unconfigured scenes fall back to the tenth ranked hard metric within country and scene. Recommended rows are highlighted in light yellow, the Recommended column is set to yes, and the same rows are collected in the Recommendations sheet.]
        - [Evidence Rule, Every conclusion must be traceable to field-level evidence, source, date, evidence tier, and cross-check status.]
        - [Inference Rule, Inference only fills empty fields, must be recorded in the inference trace, and cannot override direct evidence.]
        - [Scene Modeling Rule, Each scene uses its own primary indicators, proxy basis, and demand parameter ranges.]
        - [Proxy Rule, Proxy model details are centralized in the Proxy Model sheet.]
        - [Build Status Rule, Existing indoor build status is judged independently; Unknown is allowed but empty values are not.]
        - [Output Constraint, Main table headers are fixed; scene sheets keep headers even when empty. Primary Metric Value is a typed numeric column, not a formatted text copy.]
        - [Evidence Status Definitions, Verified / Supported / Indicative / Insufficient.]
        - [Google Maps Link Rule, Main table must retain the Google Maps link.]
    ppt:
      title: iSite2 Insight Cards
      subtitle_candidates: "{count} candidate sites"
      logic_title: Rule / Advancement Logic
      logic_body: Evidence -> Scene Model -> Build Status -> Demand -> Inference -> Conclusion -> Review Queue. Build status is judged independently from property value.
