version: "0.1"
purpose: "Build localized, low-cost evidence queries before escalating to Firecrawl."

defaults:
  search_limit: 5
  firecrawl_gap_limit: 2
  scrape: false
  firecrawl_mode: "last_resort"
  query_joiner: " OR "

phases:
  structured_source_discovery:
    description: "Search free structured APIs, public CSVs, and official catalog indexes first."
    use_firecrawl: false
  official_catalog_discovery:
    description: "Search official country/city/operator portals and public report catalogs."
    use_firecrawl: false
  metric_extraction:
    description: "Use localized metric terms to find first-level quantitative scene evidence."
    use_firecrawl: false
  firecrawl_gap_fill:
    description: "Escalate only after structured and official-source passes fail."
    use_firecrawl: true

