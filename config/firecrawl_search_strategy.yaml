      - "{country} largest hospital bed capacity official"
      - "{country} hospital beds operator profile contractor"
    candidate_metric_queries:
      - "{property_name} beds official"
      - "{property_name} bed capacity operator profile"
      - "{property_name} hospital project beds contractor"
    strengthening_queries:
      - "{property_name} beds second source"
      - "{property_name} hospital official operator profile"
    preferred_channels:
      - hospital official site
      - operator network
      - ministry listing
    fallback_channels:
      - contractor/project page
      - international hospital network profile
      - recognized partner page
    build_status_queries:
      - "{property_name} hospital indoor 5G coverage operator announcement"
      - "{property_name} distributed antenna system mobile operator"

  university:
    scan_priority: 90
    priority_band: supplemental
    objective_indicators:
      - enrollment
      - student_count
      - campus_population
      - campus_center_role
    discovery_queries:
