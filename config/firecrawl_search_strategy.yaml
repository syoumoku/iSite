      - route maps
      - OSM for coordinates only
    build_status_queries:
      - "{property_name} station indoor 5G coverage operator announcement"
      - "{property_name} transport hub distributed antenna system mobile operator"

  cruise_port:
    scan_priority: 50
    priority_band: secondary_landmark
    objective_indicators:
      - passenger_throughput
      - terminal_role
      - international_cruise_frequency
    discovery_queries:
      - "{country} cruise terminal official passenger throughput"
      - "{country} cruise port passenger traffic annual report"
