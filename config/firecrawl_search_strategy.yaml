      - "{property_name} students second source"
      - "{property_name} official campus profile"
    preferred_channels:
      - official factbook or quick facts
      - ministry higher-education statistics
      - national statistics portal
      - university annual report
    fallback_channels:
      - official admissions/student pages for identity only
      - public aggregators only as tertiary metric backup
    build_status_queries:
      - "{property_name} campus indoor 5G coverage operator announcement"
      - "{property_name} university DAS indoor network mobile operator"

  transport_hub:
    scan_priority: 5
    priority_band: primary_landmark
    objective_indicators:
      - daily_ridership
      - interchange_volume
      - line_count
      - hub_role
    discovery_queries:
