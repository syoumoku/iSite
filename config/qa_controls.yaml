  - id: QA-REQUEST-001
    title: Operational requests and contact PII never enter the public snapshot data plane
    domain: service_requests
    severity: critical
    enforcement: automated
    rule_refs: [src/isite2/service_requests.py, scripts/publish_public_snapshot.py]
    test_refs: [tests/test_service_requests.py]
  - id: QA-REQUEST-002
    title: Request execution requires exact authenticated approval and valid state transitions
    domain: service_requests
    severity: critical
    enforcement: automated
    rule_refs: [src/isite2/service_requests.py, src/isite2/api/main.py, scripts/service_request_admin.py]
    test_refs: [tests/test_service_requests.py]
  - id: QA-REQUEST-003
    title: Request submission delivery and public update publication are idempotent and release-gated
    domain: service_requests
    severity: critical
    enforcement: automated
    rule_refs: [src/isite2/service_requests.py, scripts/service_request_admin.py]
    test_refs: [tests/test_service_requests.py]
  - id: QA-REQUEST-004
    title: Multi-scene scan requests preserve one combined target and verify custom locations
