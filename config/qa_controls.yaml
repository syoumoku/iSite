    severity: medium
    enforcement: manual
    runbook_ref: docs/15_qa_lessons_learned.md#manual-gates
    artifact_required: true
  - id: QA-OUTPUT-003
    title: Scene primary metrics must pass metric-specific plausibility ceilings before report activation
    domain: output
    severity: critical
    enforcement: automated
    rule_refs: [scripts/qa_standard_report_ppt_metrics.py]
    test_refs: [tests/test_standard_report_output_audit.py]
  - id: QA-OUTPUT-004
    title: Confirmed-count reports use one property-level evidence rule for zero and non-zero cells
    domain: output
    severity: high
    enforcement: manual
    runbook_ref: docs/15_qa_lessons_learned.md#manual-gates
    artifact_required: true
  - id: QA-REVIEW-001
    title: Review queue actions are concrete and executable
