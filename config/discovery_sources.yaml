version: "0.1"
source_types:
  official_government:
    label: "official/government"
    priority: 10
  operator_venue:
    label: "operator/venue"
    priority: 20
  annual_report_pdf:
    label: "annual_report/pdf"
    priority: 30
  firecrawl_search:
    label: "firecrawl/search+scrape"
    priority: 35
  map_entity:
    label: "map/entity"
    priority: 40
  operator_build_status:
    label: "operator/build-status"
    priority: 50
  secondary_reference:
    label: "secondary_reference"
    priority: 60

scenes:
  airport_terminal:
    scene_label: "airport terminal"
    scan_priority: 0
    priority_band: "primary_landmark"
    preferred_indicators:
      - annual_passenger_throughput
      - passenger_throughput
      - terminal_role
    query_templates:
      official_government:
        - "{country} airport authority passenger traffic annual report"
        - "{country} international airport passenger statistics official"
      operator_venue:
        - "{country} international airport official passengers terminal"
      annual_report_pdf:
        - "{country} airport annual report passengers filetype:pdf"
      firecrawl_search:
        - "{country} airport passenger traffic terminal official annual report"
        - "{country} busiest airports passenger traffic CEIC"
        - "{country} airport passenger statistics civil aviation authority"
      map_entity:
        - "{country} international airport coordinates"
      operator_build_status:
        - "{country} airport terminal indoor 5G coverage operator announcement"
        - "{country} airport distributed antenna system mobile operator"
      secondary_reference:
        - "{country} busiest airport passenger traffic"
  convention_center:
    scene_label: "convention center"
    scan_priority: 10
    priority_band: "primary_landmark"
    preferred_indicators:
      - exhibition_area
      - annual_events
      - peak_event_capacity
